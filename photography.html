<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photography — Roshan Sundaram</title>
    <meta name="description" content="Roshan Sundaram — Photography.">

    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
</head>

<body>

    <main>

        <div class="content-layout">

            <aside class="identity">

                <div class="headshot-spacer" aria-hidden="true"></div>

                <div class="vertical-name">
                    <h1>Photography</h1>
                </div>

                <nav class="site-nav">
                    <a href="index.html">About</a>
                    <a href="portfolio.html">Portfolio</a>
                    <a href="photography.html" class="active">Photography</a>
                </nav>

                <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
                    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
                </button>

            </aside>

            <section class="photo-list">

                <div class="photo-block">

                    <img
                        src="Photo.jpg"
                        alt="Photo placeholder one"
                        class="photo-image"
                    >

                    <p class="photo-caption">
                        Caption placeholder — replace with the photo's title, location, or date.
                    </p>

                </div>

                <div class="photo-block">

                    <img
                        src="Photo.jpg"
                        alt="Photo placeholder two"
                        class="photo-image"
                    >

                    <p class="photo-caption">
                        Caption placeholder — replace with the photo's title, location, or date.
                    </p>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
